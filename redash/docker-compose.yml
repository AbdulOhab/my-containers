version: "3.9"

services:
  postgres:
    image: docker.io/library/postgres:15-alpine
    container_name: redash_postgres
    environment:
      POSTGRES_USER: redash
      POSTGRES_PASSWORD: redash_password
      POSTGRES_DB: redash
    volumes:
      - ./pgdata:/var/lib/postgresql/data

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: redash_redis
    command: ["redis-server", "--appendonly", "yes"]

  redash_server:
    image: docker.io/redash/redash:10.1.0.b50633
    container_name: redash_server
    depends_on:
      - postgres
      - redis
    ports:
      - "5000:5000"
    environment:
      REDASH_DATABASE_URL: "postgresql://redash:redash_password@redash_postgres:5432/redash"
      REDASH_COOKIE_SECRET: "demo_cookie_secret_1234567890!@#"
      REDASH_SECRET_KEY: "demo_secret_key_0987654321!@#"
      REDASH_REDIS_URL: "redis://redash_redis:6379/0"
    command: server
    # NOTE: Do not mount /app; it breaks the image entrypoint.

  redash_worker:
    image: docker.io/redash/redash:10.1.0.b50633
    container_name: redash_worker
    depends_on:
      - redash_server
      - postgres
      - redis
    environment:
      REDASH_DATABASE_URL: "postgresql://redash:redash_password@redash_postgres:5432/redash"
      REDASH_COOKIE_SECRET: "demo_cookie_secret_1234567890!@#"
      REDASH_SECRET_KEY: "demo_secret_key_0987654321!@#"
      REDASH_REDIS_URL: "redis://redash_redis:6379/0"
    command: worker

volumes:
  pgdata:
  redash_data:
# result: Internal Server Error
